  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}

  // Special characters ko safe banata hai
  const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const tags=a=>`<div class="tags">${a.map(s=>`<span class="tag">${esc(s)}</span>`).join("")}</div>`;

  // Ek card banata hai (title, meta, points, link, demo box)
  const card=i=>`<div class="card rv"><h3>${esc(i.title)}</h3>${i.meta?`<div class="meta">${esc(i.meta)}</div>`:""}
    ${i.points&&i.points.length?"<ul>"+i.points.map(p=>`<li>${esc(p)}</li>`).join("")+"</ul>":""}
    ${i.link?`<a class="b p plink" target="_blank" rel="noopener" href="${esc(i.link.url)}">${esc(i.link.text)} →</a>`:""}
    ${i.demo?`<div class="demo">🔑 Demo login &nbsp; Username: <code>${esc(i.demo.user)}</code> &nbsp; Password: <code>${esc(i.demo.pass)}</code></div>`:""}</div>`;

  // Ek section banata hai; content khali ho to section nahi dikhta
  const sec=(id,title,body)=>body?`<section id="${id}"><h2 class="rv">${title}</h2>${body}</section>`:"";

  // ---------- Upar ka hissa bharna ----------
  document.title=CV.name.charAt(0)+CV.name.slice(1).toLowerCase()+" | DevOps Engineer – AWS, Linux, CI/CD";
  $("name").textContent=CV.name; $("logo").textContent=CV.logo;
  $("sum").textContent=CV.about.split(". ")[0]+".";
  $("foot").textContent="© "+new Date().getFullYear()+" "+CV.name+" · Built with HTML, CSS & JavaScript";
  $("stats").innerHTML=[
    [CV.projects.length+"+","Projects"],[CV.experience.length],
    [Object.values(CV.skills).flat().length+"+","Skills"]
  ].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("");

  // ---------- Navbar links ----------
  const nav=[["about","About"],["skills","Skills"],["experience","Experience"],["projects","Projects"],["education","Education"],["contact","Contact"]];
  $("links").innerHTML=nav.map(([id,t])=>`<a href="#${id}">${t}</a>`).join("");

  // ---------- Contact ----------
  const c=CV.contact, contact=[
    c.email&&`<a href="mailto:${esc(c.email)}">✉ ${esc(c.email)}</a>`,
    c.phone&&`<a href="tel:${esc(c.phone.replace(/\s/g,""))}">📞 ${esc(c.phone)}</a>`,
    c.linkedin&&`<a href="${esc(c.linkedin)}" target="_blank" rel="noopener">in LinkedIn</a>`,
    c.location&&`<span>📍 ${esc(c.location)}</span>`
  ].filter(Boolean).join("");

  // ---------- Saare sections page par lagana ----------
  // Section ka heading badalna ho to sec("id","YAHAN",...) mein badlo.
  // Kisi section ko hatana ho to uski poori line delete kar do.
  $("main").innerHTML =
    sec("about","About Me",`<div class="card rv"><p style="margin:0;color:var(--muted)">${esc(CV.about)}</p></div>`) +
    sec("skills","Technical Skills",`<div class="card rv">${Object.entries(CV.skills).map(([k,v])=>`<div class="grp"><div class="gl">${esc(k)}</div>${tags(v)}</div>`).join("")}</div>`) +
    sec("experience","Experience",`<div class="stack">${CV.experience.map(card).join("")}</div>`) +
    sec("projects","Projects",`<div class="cols">${CV.projects.map(card).join("")}</div>`) +
    sec("education","Education & Certificates",`<div class="cols">${CV.education.map(card).join("")}</div>`) +
    sec("hobbies","Hobbies",`<div class="card rv">${tags(CV.hobbies)}</div>`) +
    sec("contact","Get In Touch",`<div class="contact rv">${contact}</div>`);

  // ---------- Role ki typing animation ----------
  (function(){
    const el=$("role"), w=CV.typing; let wi=0,ci=0,del=false;
    if(matchMedia("(prefers-reduced-motion:reduce)").matches){el.textContent=w[0];return}
    (function tick(){
      const word=w[wi];
      el.textContent=word.slice(0,ci);
      if(!del&&ci===word.length){del=true;return setTimeout(tick,1500)}
      if(del&&ci===0){del=false;wi=(wi+1)%w.length}
      ci+=del?-1:1; setTimeout(tick,del?35:70);
    })();
  })();

  // ---------- Scroll par section upar aana ----------
  const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{threshold:.08});
  document.querySelectorAll(".rv").forEach(el=>io.observe(el));

  // ---------- CURSOR GLOW (video wala effect) ----------
  // Mouse hilne par glow, dot aur ring dheere dheere peeche peeche chalte hain
  (function(){
    if(matchMedia("(hover:none)").matches) return;
    const glow=$("glow"),dot=$("dot"),ring=$("ring");
    let mx=innerWidth/2,my=innerHeight/2,gx=mx,gy=my,rx=mx,ry=my;
    addEventListener("mousemove",e=>{
      mx=e.clientX;my=e.clientY;
      [glow,dot,ring].forEach(x=>x.classList.add("on"));
      // card ke andar spotlight ki position
      const cd=e.target.closest&&e.target.closest(".card");
      if(cd){const r=cd.getBoundingClientRect();cd.style.setProperty("--mx",(e.clientX-r.left)+"px");cd.style.setProperty("--my",(e.clientY-r.top)+"px")}
      // link ya button par ring bada ho jata hai
      ring.classList.toggle("big",!!(e.target.closest&&e.target.closest("a,button,.tag,.card")));
    });
    document.addEventListener("mouseleave",()=>[glow,dot,ring].forEach(x=>x.classList.remove("on")));
    (function loop(){
      gx+=(mx-gx)*.08; gy+=(my-gy)*.08;   // .08 = glow kitni dheere chale (chhota number = zyada dheere)
      rx+=(mx-rx)*.2;  ry+=(my-ry)*.2;    // ring ki speed
      glow.style.transform=`translate(${gx}px,${gy}px)`;
      ring.style.transform=`translate(${rx}px,${ry}px)`;
      dot.style.transform=`translate(${mx}px,${my}px)`;
      requestAnimationFrame(loop);
    })();
  })();

  // ---------- Dark / Light toggle ----------
  $("theme").onclick=()=>{
    const r=document.documentElement;
    r.dataset.theme=r.dataset.theme==="light"?"dark":"light";
  };
</script>
</body>
</html>
